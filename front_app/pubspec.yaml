name: drugtest
description: 약봉투 - 약품 상호작용 확인 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  provider: ^6.1.2
  image_picker: ^1.1.2
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # 한글 글꼴을 앱에 넣는다. 없으면 웹이 글자를 만날 때마다 구글 서버에서 대체 글꼴 조각을 받아
  # 그동안 글자가 깨져 보인다(카드를 열 때 "지지직"). 쓰이는 글자만 남긴 부분집합이다 — assets/fonts/OFL.txt 참고.
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700
