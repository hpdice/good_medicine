[tool.poetry]
# 배포용 라이브러리가 아니라 애플리케이션이라 패키지로 빌드하지 않는다(Poetry 1.8+ 애플리케이션 모드).
# 의존성 관리만 쓰고, 설치는 항상 `poetry install --no-root`.
package-mode = false
name = "drugtest-backend"
version = "0.1.0"
description = "굿메디슨 — AI 의약품 상호작용 분석 플랫폼 백엔드"
authors = ["drugtest"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
pydantic = {extras = ["email"], version = "^2.7.0"}
pydantic-settings = "^2.3.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
bcrypt = "^4.1.0"
python-dotenv = "^1.0.0"
slowapi = "^0.1.9"
cryptography = "^42.0.0"
httpx = "^0.27.0"
firebase-admin = "^6.0.0"
pytesseract = "^0.3.10"
pillow = "^10.3.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.4.0"
httpx = "^0.27.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# conftest 는 app import 전에 os.environ 을 세팅해야 하므로 import 순서 예외.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
