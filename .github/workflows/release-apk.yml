# APK 릴리스 — Flutter 안드로이드 APK 를 빌드해 GitHub Release 에 첨부한다.
# 트리거: 태그 push(`v*`) 또는 Actions 에서 수동 실행(version 입력).
# 인증: 워크플로 기본 GITHUB_TOKEN (contents: write) — 개인 토큰 불필요.
# 필요한 Secret: WEB_API_BASE_URL (APK 가 호출할 API 주소, Vercel 워크플로와 공용)
name: release apk

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 태그 (예: v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.6
          cache: true

      - name: resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # 고정 릴리스 키로 서명한다 — 서명 키가 없으면 빌드마다 임시 디버그 키로 서명돼 Play 프로텍트가 "확인되지 않은 앱"으로 경고하고,
      # 이전 설치본 위에 업데이트도 안 된다. 키·비밀번호는 저장소 Secrets에만 있다.
      - name: prepare release signing key
        working-directory: front_app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.jks"
          } > key.properties

      - name: build apk
        working-directory: front_app
        run: |
          flutter pub get
          TAG="${{ steps.tag.outputs.name }}"
          flutter build apk --release \
            --build-name="${TAG#v}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=BASE_URL="${{ secrets.WEB_API_BASE_URL }}"

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: front_app/build/app/outputs/flutter-apk/app-release.apk
