services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - D:/drugTest/postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # 로컬호스트에만 바인딩 — LAN/외부에서 직접 접근 불가.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # 로컬호스트에만 바인딩. 외부 노출은 docker-compose.prod.yml 의 tailscale 컨테이너가
      # compose 네트워크로 backend:8000 에 프록시하는 경로 하나뿐 (Tailscale Funnel).
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # 개발용 소스 바인드마운트(./backend:/app)는 docker-compose.override.yml 에 있다(자동 로드).
    # 원격 시연/배포는 `-f docker-compose.yml -f docker-compose.prod.yml` 로 override 를 배제하고
    # Tailscale Funnel 컨테이너를 함께 띄운다. (프론트 웹은 Vercel 이 별도 호스팅)

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      # 로컬호스트에만 바인딩 — 이 포트가 외부/LAN에 열리면 인증 없이 로컬 LLM을 쓸 수 있게 됨.
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_data:
